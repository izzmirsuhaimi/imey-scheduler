    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("imey_scheduler:theme"));
          if (stored !== "light" && stored !== "dark") {
            stored =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.dataset.theme = stored;
        } catch (error) {}
      })();
